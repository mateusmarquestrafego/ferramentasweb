<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="coverBg" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#15213b" />
      <stop offset="45%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Glow Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="yellowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1640" height="624" fill="url(#coverBg)" />
  <rect width="1640" height="624" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1300" cy="200" r="350" fill="url(#cyanOrb)" />
  <circle cx="200" cy="500" r="300" fill="url(#yellowOrb)" />

  <!-- LEFT SECTION: BRANDING & VALUE PROPOSITION -->
  <g transform="translate(80, 70)">
    
    <!-- Top Studio Pill Badge -->
    <rect width="390" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <circle cx="22" cy="17" r="4" fill="#38bdf8" />
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1">
      STUDIO OFICIAL DE EXTENSÕES INTELIGENTES
    </text>

    <!-- Main Big Headline -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Ferramentas que geram
    </text>
    <text x="0" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      <tspan fill="#facc15">lucro real</tspan> no seu navegador.
    </text>

    <!-- Subheadline -->
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Extensões de alta velocidade para Mercado Livre e E-commerce.
    </text>
    <text x="0" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Espione faturamento, estoque no Full e calcule margem limpa sem mensalidades.
    </text>

    <!-- Feature Mini Cards Grid -->
    <g transform="translate(0, 260)">
      
      <!-- Card 1 -->
      <rect x="0" y="0" width="190" height="64" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="16" y="26" font-size="16">🔍</text>
      <text x="44" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#fff">Raio-X de Faturamento</text>
      <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b">Vendas e giro diário</text>

      <!-- Card 2 -->
      <rect x="205" y="0" width="190" height="64" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="221" y="26" font-size="16">📦</text>
      <text x="249" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Estoque no Full</text>
      <text x="221" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b">Unidades nos galpões</text>

      <!-- Card 3 -->
      <rect x="410" y="0" width="190" height="64" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="426" y="26" font-size="16">💰</text>
      <text x="454" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#34d399">Margem Limpa</text>
      <text x="426" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b">Desconto de taxas ML</text>

      <!-- Card 4 -->
      <rect x="615" y="0" width="190" height="64" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(250, 204, 21, 0.3)" stroke-width="1.5" />
      <text x="631" y="26" font-size="16">👑</text>
      <text x="659" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#facc15">Lote Founder</text>
      <text x="631" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#4ade80">R$ 119 ÚNICO VITALÍCIO</text>
    </g>

    <!-- Bottom Social & Web Proof -->
    <g transform="translate(0, 360)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#cbd5e1">
        🌐 ferramentasweb.vercel.app
      </text>
      <text x="240" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#64748b">
        •  @ferramentasweb  •  Suporte WhatsApp Oficial: +55 (48) 99619-2775
      </text>
    </g>
  </g>

  <!-- RIGHT SECTION: CYBER GLASS DASHBOARD MOCKUP -->
  <g transform="translate(980, 80)">
    
    <!-- Outer Glass Window -->
    <rect width="580" height="450" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />
    
    <!-- Window Header -->
    <rect width="580" height="50" rx="18" fill="rgba(10, 15, 28, 0.95)" />
    <circle cx="28" cy="25" r="6" fill="#ef4444" />
    <circle cx="48" cy="25" r="6" fill="#facc15" />
    <circle cx="68" cy="25" r="6" fill="#10b981" />
    
    <text x="100" y="30" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#94a3b8">
      MeliSpy Pro v2.0 • Painel Ativo
    </text>

    <rect x="460" y="14" width="100" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <text x="510" y="29" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#34d399">
      AO VIVO
    </text>

    <!-- Product Header Box -->
    <g transform="translate(24, 70)">
      <rect width="532" height="70" rx="10" fill="rgba(21, 30, 50, 0.7)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#facc15">
        ⚡ ANÚNCIO LÍDER DETECTADO (MERCADO LIVRE BR)
      </text>
      <text x="16" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">
        Fone Bluetooth TWS Gamer Pro Cancelamento Ruído
      </text>
      <text x="440" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#38bdf8">
        R$ 78,90
      </text>
    </g>

    <!-- 4 Big Metric Blocks -->
    <g transform="translate(24, 156)">
      
      <!-- Metric 1 -->
      <rect x="0" y="0" width="258" height="90" rx="12" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
        Faturamento Estimado:
      </text>
      <text x="18" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#facc15">
        R$ 324.900,00
      </text>

      <!-- Metric 2 -->
      <rect x="274" y="0" width="258" height="90" rx="12" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="292" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
        Estoque no Full:
      </text>
      <text x="292" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#38bdf8">
        142 un. <tspan font-size="12" font-weight="700" fill="#64748b">restantes</tspan>
      </text>

      <!-- Metric 3 -->
      <rect x="0" y="104" width="258" height="90" rx="12" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="18" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
        Velocidade de Giro:
      </text>
      <text x="18" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#4ade80">
        ~38 un / dia
      </text>

      <!-- Metric 4 -->
      <rect x="274" y="104" width="258" height="90" rx="12" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="292" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">
        Margem Líquida Real:
      </text>
      <text x="292" y="168" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#ffffff">
        24,6% <tspan font-size="13" font-weight="700" fill="#34d399">(no bolso)</tspan>
      </text>
    </g>

    <!-- Bottom Action Pill inside Mockup -->
    <g transform="translate(24, 368)">
      <rect width="532" height="48" rx="8" fill="rgba(250, 204, 21, 0.12)" stroke="#facc15" stroke-width="1" />
      <polygon points="40,24 32,15 36,15 34,9 44,18 39,18" fill="#facc15" />
      <text x="56" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#facc15">
        Calculadora Reversa Ativa: Descontou R$ 13,41 de taxas e R$ 6 de frete.
      </text>
    </g>

  </g>
</svg>
