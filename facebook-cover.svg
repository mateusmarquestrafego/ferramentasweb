<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 624" width="1640" height="624">
  <defs>
    <!-- Dark Tech Radial Background -->
    <radialGradient id="coverBgClean" cx="60%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141f36" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid -->
    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>

    <!-- Badge Border Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1640" height="624" fill="url(#coverBgClean)" />
  <rect width="1640" height="624" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1200" cy="180" r="320" fill="url(#glowCyan)" />
  <circle cx="480" cy="380" r="280" fill="url(#glowYellow)" />

  <!-- ==============================================================
       TOTAL SAFE ZONE: CONTEÚDO 100% CONCENTRADO DO CENTRO PARA A DIREITA
       (O canto inferior esquerdo e o meio inferior ficam 100% livres para
        o avatar redondo e o nome de perfil do Facebook!)
       ============================================================== -->

  <!-- TOP BRANDING (Centro-Esquerda, bem no topo, fora da área do avatar) -->
  <g transform="translate(420, 65)">
    <!-- Pill Badge -->
    <rect width="360" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="url(#badgeBorder)" stroke-width="1.5" />
    <circle cx="22" cy="17" r="4" fill="#38bdf8" />
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8" letter-spacing="1">
      STUDIO OFICIAL DE EXTENSÕES INTELIGENTES
    </text>
  </g>

  <!-- MAIN HEADLINE & VALUE PROP (Área nobre e limpa) -->
  <g transform="translate(420, 150)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Ferramentas que geram
    </text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">
      <tspan fill="#facc15">lucro real</tspan> no seu navegador.
    </text>

    <text x="0" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Soluções enxutas de alta performance para Mercado Livre e E-commerce.
    </text>
    <text x="0" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
      Mineração de dados, estoque no Full e calculadora de taxas sem mensalidade.
    </text>

    <!-- 4 Value Pills (Limpos e alinhados) -->
    <g transform="translate(0, 160)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="44" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="27" font-size="14">🔍</text>
      <text x="36" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#fff">Raio-X de Vendas</text>

      <!-- Pill 2 -->
      <rect x="172" y="0" width="160" height="44" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="186" y="27" font-size="14">📦</text>
      <text x="208" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Estoque no Full</text>

      <!-- Pill 3 -->
      <rect x="344" y="0" width="160" height="44" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="358" y="27" font-size="14">💰</text>
      <text x="380" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#34d399">Margem Limpa</text>

      <!-- Pill 4 -->
      <rect x="516" y="0" width="160" height="44" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(250, 204, 21, 0.35)" stroke-width="1.5" />
      <text x="530" y="27" font-size="14">👑</text>
      <text x="552" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#facc15">Lote Founder</text>
    </g>

    <!-- Domain & WhatsApp (Posicionado no topo de segurança) -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#cbd5e1">
        🌐 ferramentasweb.vercel.app  •  @ferramentasweb
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: SLEEK MINI DASHBOARD MOCKUP (Totalmente seguro na direita) -->
  <g transform="translate(1160, 95)">
    <!-- Glass Window Container -->
    <rect width="400" height="430" rx="16" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />
    
    <!-- Window Bar -->
    <rect width="400" height="44" rx="16" fill="rgba(10, 15, 28, 0.98)" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#facc15" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />
    <text x="80" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#94a3b8">
      MeliSpy Pro • Inteligência ML
    </text>

    <!-- Product Title -->
    <g transform="translate(20, 64)">
      <rect width="360" height="54" rx="8" fill="rgba(21, 30, 50, 0.8)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#facc15">
        ⚡ ANÚNCIO LÍDER ANALISADO
      </text>
      <text x="14" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">
        Fone Bluetooth Gamer • Preço: R$ 78,90
      </text>
    </g>

    <!-- 4 Clean Metrics Grid -->
    <g transform="translate(20, 134)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="174" height="82" rx="10" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      <text x="14" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Faturamento Total:</text>
      <text x="14" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#facc15">R$ 324.900</text>

      <!-- Metric 2 -->
      <rect x="186" y="0" width="174" height="82" rx="10" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="200" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Estoque no Full:</text>
      <text x="200" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#38bdf8">142 un.</text>

      <!-- Metric 3 -->
      <rect x="0" y="94" width="174" height="82" rx="10" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
      <text x="14" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Velocidade / Giro:</text>
      <text x="14" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#4ade80">~38 un / dia</text>

      <!-- Metric 4 -->
      <rect x="186" y="94" width="174" height="82" rx="10" fill="rgba(10, 15, 28, 0.9)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
      <text x="200" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">Margem Líquida:</text>
      <text x="200" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="900" fill="#ffffff">24,6%</text>
    </g>

    <!-- Bottom Tool Highlight -->
    <g transform="translate(20, 334)">
      <rect width="360" height="42" rx="8" fill="rgba(250, 204, 21, 0.12)" stroke="#facc15" stroke-width="1" />
      <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#facc15">
        ⚡ Extensão Chrome: Cálculo de taxas em tempo real
      </text>
    </g>
  </g>

</svg>
