<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141d33" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Tech Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Lightning / Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Cyan Circuit Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#facc15" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadows / Glow Filters -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1080" fill="url(#bgGrad)" />

  <!-- Ambient Light Center -->
  <circle cx="540" cy="500" r="420" fill="url(#coreGlow)" />

  <!-- Circular Profile Safe Boundary Guides (Subtle) -->
  <circle cx="540" cy="540" r="490" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- Outer Orbital Ring -->
  <circle cx="540" cy="480" r="330" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="14 10" opacity="0.6" />
  
  <!-- Outer Accent Nodes -->
  <circle cx="540" cy="150" r="6" fill="#facc15" filter="url(#yellowGlow)" />
  <circle cx="870" cy="480" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />
  <circle cx="540" cy="810" r="6" fill="#facc15" filter="url(#yellowGlow)" />
  <circle cx="210" cy="480" r="6" fill="#38bdf8" filter="url(#cyanGlow)" />

  <!-- Inner Tech Shield / Hexagon Base -->
  <polygon points="540,210 770,342 770,618 540,750 310,618 310,342" 
           fill="rgba(15, 23, 42, 0.75)" 
           stroke="rgba(56, 189, 248, 0.25)" 
           stroke-width="3" />

  <polygon points="540,230 750,352 750,608 540,730 330,608 330,352" 
           fill="none" 
           stroke="rgba(250, 204, 21, 0.15)" 
           stroke-width="2" />

  <!-- Stylized Geometric "FW" Network Circuits -->
  <!-- Circuit Lines Left (F) -->
  <path d="M 390 380 L 450 380 L 480 430 L 450 480 L 390 480" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="390" cy="380" r="6" fill="#38bdf8" />
  <circle cx="390" cy="480" r="6" fill="#38bdf8" />

  <!-- Circuit Lines Right (W) -->
  <path d="M 690 380 L 630 380 L 600 430 L 630 480 L 690 480" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="690" cy="380" r="6" fill="#38bdf8" />
  <circle cx="690" cy="480" r="6" fill="#38bdf8" />

  <!-- Main Central Lightning Bolt (High-Voltage Intelligence Symbol) -->
  <polygon points="565,260 410,490 525,490 475,700 670,450 555,450" 
           fill="url(#boltGrad)" 
           filter="url(#yellowGlow)" />

  <!-- Inner Energy Core (White Highlight) -->
  <polygon points="560,285 435,480 535,480 495,660 645,460 550,460" 
           fill="#ffffff" 
           opacity="0.35" />

  <!-- Typography: FerramentasWeb -->
  <text x="540" y="850" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="52" 
        font-weight="900" 
        fill="#ffffff" 
        letter-spacing="-1">
    Ferramentas<tspan fill="#facc15">Web</tspan>
  </text>

  <!-- Subtitle: Studio Badge -->
  <text x="540" y="895" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="20" 
        font-weight="800" 
        fill="#38bdf8" 
        letter-spacing="6">
    STUDIO DE EXTENSÕES
  </text>
</svg>
