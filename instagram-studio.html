      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;

      color: #000;
      border-color: #38bdf8;
    }

      border-radius: 18px;

      grid-template-columns: 520px 1fr;
      gap: 28px;
      align-items: start;

      border-color: #facc15;

      border-radius: 12px;

        copy: `Ainda com alguma dúvida sobre o MeliSpy Pro? Separamos as 4 perguntas mais comuns que chegam no nosso WhatsApp para responder com total transparência.\n\nSegurança total, sem mensalidade, instalação em 1 minuto e garantia de 7 dias.\n\n👉 Toque no link da bio para garantir sua vaga no lote de fundadores!\n\n#duvidas #faq #mercadolivre #garantia #suporteaocliente #vendedormercadolivre`
      },
      {
        id: 16,
        sem: 'sem4',
        type: 'bio',
        dia: 'Semana 4 • Quarta-feira',
        formato: 'Estático (Urgência Fechamento)',
        ctaLabel: '🔗 Link na Bio',
        titulo: 'Últimas licenças do Lote Founder por R$ 119 Vitalício',
        slidesArt: [
          {
            tag: 'ÚLTIMA CHAMADA', tagClass: 'tag-red',
            headline: 'ÚLTIMAS LICENÇAS DO LOTE FOUNDER: <span class="highlight-yellow">R$ 119 VITALÍCIO</span> ⏳',
            sub: 'O lote com valor de lançamento está chegando ao fim:',
            customHtml: `
              <div class="ab-box-glass" style="border: 1px solid #facc15; text-align:center; padding:18px;">
                <div style="font-size:11px; color:#94a3b8; text-decoration:line-through;">DE R$ 238,00</div>
                <div style="font-size:32px; font-weight:900; color:#facc15; margin:4px 0;">R$ 119,00</div>
                <div style="font-size:11px; color:#34d399; font-weight:800; margin-bottom:12px;">PAGAMENTO ÚNICO VITALÍCIO</div>
                
                <div style="background:#090d16; border-radius:999px; height:8px; width:100%; overflow:hidden; margin-bottom:6px;">
                  <div style="background:linear-gradient(90deg, #facc15, #ef4444); width:89%; height:100%;"></div>
                </div>
                <div style="font-size:10px; color:#94a3b8; font-weight:700;">89% DAS VAGAS PREENCHIDAS</div>
              </div>
              <div class="ab-box-glass" style="font-size:11px; color:#cbd5e1; text-align:center;">
                Após o encerramento, a ferramenta passará para o plano de assinatura mensal de R$ 35/mês.
              </div>
            `,
            footerRight: 'Link na Bio 👑'
          }
        ],
        copy: `Atenção: O lote de fundadores do MeliSpy Pro está chegando ao fim! ⏳\n\nLiberamos uma quantidade limitada de licenças vitalícias por apenas R$ 119,00 para os primeiros vendedores da comunidade FerramentasWeb.\n\nDepois que o lote encerrar, a ferramenta passará para o modelo de assinatura recorrente.\n\nSe você quer garantir acesso permanente para sempre sem nunca pagar mensalidade:\n👉 Toque agora no link da nossa bio antes que o lote seja fechado!\n\n#urgencia #ofertalancamento #mercadolivre #mercadolivrebrasil #ecommercebrasil`
      }
    ];

    // State to track current slide for each post
    const postCurrentSlide = {};
    postsData.forEach(p => { postCurrentSlide[p.id] = 0; });

    function renderPosts(filter) {
      const container = document.getElementById('posts-list');
      container.innerHTML = '';

      const filtered = postsData.filter(p => {
        if (filter === 'all') return true;
        if (filter === 'direct') return p.type === 'direct';
        if (filter === 'bio') return p.type === 'bio';
        return p.sem === filter;
      });

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'post-card';
        card.id = `post-card-${p.id}`;

        let ctaBadgeClass = p.type === 'direct' ? 'cta-direct' : (p.type === 'bio' ? 'cta-bio' : 'cta-none');

        // Slides switcher tabs if carousel
        let switcherHtml = '';
        if (p.slidesArt.length > 1) {
          switcherHtml = `
            <div class="slide-switcher">
              ${p.slidesArt.map((s, idx) => `
                <button class="slide-tab-btn ${idx === postCurrentSlide[p.id] ? 'active' : ''}" onclick="switchSlide(${p.id}, ${idx})">
                  ${idx === 0 ? 'Capa' : 'Slide ' + (idx + 1)}
                </button>
              `).join('')}
            </div>
          `;
        }

        const currentArt = p.slidesArt[postCurrentSlide[p.id]];

        card.innerHTML = `
          <!-- Left Column: Artboard Studio -->
          <div class="artboard-container">
            <div style="width:100%;">
              <div class="post-header">
                <span class="post-num">Post #${String(p.id).padStart(2, '0')} • ${p.dia}</span>
                <span class="post-cta-type ${ctaBadgeClass}">${p.ctaLabel}</span>
              </div>
              <h3 class="post-title">${p.titulo}</h3>
              ${switcherHtml}
            </div>

            <!-- The Artboard Box (Captured by html2canvas) -->
            <div class="artboard-canvas-wrapper" id="artboard-box-${p.id}">
              <div class="artboard-inner" style="background: radial-gradient(circle at 10% 20%, #151e33 0%, #090d16 90%);">
                <div class="ab-top-bar">
                  <div class="ab-brand">
                    <span class="meli">Meli</span>Spy <span style="font-size:11px; background:#facc15; color:#000; padding:1px 5px; border-radius:3px; font-weight:900;">PRO</span>
                  </div>
                  <span class="ab-tag ${currentArt.tagClass}">${currentArt.tag}</span>
                </div>

                <div class="ab-content">
                  ${currentArt.headline ? `<div class="ab-headline">${currentArt.headline}</div>` : ''}
                  ${currentArt.sub ? `<div class="ab-sub">${currentArt.sub}</div>` : ''}
                  ${currentArt.customHtml || ''}
                </div>

                <div class="ab-footer">
                  <span>@ferramentasweb</span>
                  <span class="ab-swipe">${currentArt.footerRight || 'Arrasta ➔'}</span>
                </div>
              </div>
            </div>

            <!-- Download Buttons -->
            <div class="art-actions">
              <button class="btn-download-art" onclick="downloadSingleArt(${p.id})">
                ⬇️ Baixar Imagem PNG (1080x1080)
              </button>
              ${p.slidesArt.length > 1 ? `
                <button class="btn-download-all" onclick="downloadAllSlides(${p.id})">
                  ⚡ Baixar Todos (${p.slidesArt.length})
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Right Column: Ready-to-use Caption -->
          <div class="copy-box">
            <div>
              <div class="copy-title">
                📝 Legenda Completa (Copy Pronta com Hashtags):
              </div>
              <div class="copy-text" id="copy-text-${p.id}">${p.copy}</div>
            </div>
            <button class="copy-btn" onclick="copyCaption(${p.id})">
              📋 Copiar Legenda do Post #${p.id}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function switchSlide(postId, slideIndex) {
      postCurrentSlide[postId] = slideIndex;
      const post = postsData.find(p => p.id === postId);
      if (!post) return;

      // Update active tab buttons
      const card = document.getElementById(`post-card-${postId}`);
      if (card) {
        const btns = card.querySelectorAll('.slide-tab-btn');
        btns.forEach((b, i) => {
          if (i === slideIndex) b.classList.add('active');
          else b.classList.remove('active');
        });

        // Update Artboard Box
        const art = post.slidesArt[slideIndex];
        const artWrapper = document.getElementById(`artboard-box-${postId}`);
        if (artWrapper) {
          artWrapper.innerHTML = `
            <div class="artboard-inner" style="background: radial-gradient(circle at 10% 20%, #151e33 0%, #090d16 90%);">
              <div class="ab-top-bar">
                <div class="ab-brand">
                  <span class="meli">Meli</span>Spy <span style="font-size:11px; background:#facc15; color:#000; padding:1px 5px; border-radius:3px; font-weight:900;">PRO</span>
                </div>
                <span class="ab-tag ${art.tagClass}">${art.tag}</span>
              </div>

              <div class="ab-content">
                ${art.headline ? `<div class="ab-headline">${art.headline}</div>` : ''}
                ${art.sub ? `<div class="ab-sub">${art.sub}</div>` : ''}
                ${art.customHtml || ''}
              </div>

              <div class="ab-footer">
                <span>@ferramentasweb</span>
                <span class="ab-swipe">${art.footerRight || 'Arrasta ➔'}</span>
              </div>
            </div>
          `;
        }
      }
    }

    async function downloadSingleArt(postId) {
      const el = document.getElementById(`artboard-box-${postId}`);
      if (!el) return;

      const btn = event.currentTarget;
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ Gerando PNG HD...';
      btn.disabled = true;

      try {
        const currentSlideIdx = postCurrentSlide[postId] || 0;
        const filename = `MeliSpy_Post_${String(postId).padStart(2, '0')}_Slide_${currentSlideIdx + 1}.png`;

        const canvas = await html2canvas(el, {
          scale: 2.25, // 480px * 2.25 = 1080px (Alta Resolução Instagram)
          useCORS: true,
          backgroundColor: '#090d16',
          logging: false
        });

        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();

        btn.innerHTML = '✅ Baixado com Sucesso!';
      } catch (err) {
        console.error(err);
        alert('Erro ao gerar imagem. Tente novamente.');
        btn.innerHTML = originalText;
      } finally {
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    async function downloadAllSlides(postId) {
      const post = postsData.find(p => p.id === postId);
      if (!post) return;

      const btn = event.currentTarget;
      const orig = btn.innerHTML;
      btn.innerHTML = '⏳ Baixando todos...';
      btn.disabled = true;

      const originalSlide = postCurrentSlide[postId] || 0;

      for (let i = 0; i < post.slidesArt.length; i++) {
        switchSlide(postId, i);
        await new Promise(r => setTimeout(r, 200));

        const el = document.getElementById(`artboard-box-${postId}`);
        const canvas = await html2canvas(el, {
          scale: 2.25,
          useCORS: true,
          backgroundColor: '#090d16',
          logging: false
        });

        const link = document.createElement('a');
        link.download = `MeliSpy_Post_${String(postId).padStart(2, '0')}_Slide_${i + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        await new Promise(r => setTimeout(r, 300));
      }

      switchSlide(postId, originalSlide);
      btn.innerHTML = '✅ Todos os Slides Baixados!';
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.disabled = false;
      }, 3000);
    }

    function copyCaption(id) {
      const text = document.getElementById('copy-text-' + id)?.innerText;
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.currentTarget;
          const orig = btn.innerHTML;
          btn.innerHTML = '✅ Legenda Copiada com Sucesso!';
          btn.style.background = '#10b981';
          btn.style.color = '#fff';
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.background = '#38bdf8';
            btn.style.color = '#000';
          }, 2000);
        });
      }
    }

    function filterPosts(filter) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderPosts(filter);
    }

    // Inicialização
    renderPosts('all');
  </script>

</body>
</html>
