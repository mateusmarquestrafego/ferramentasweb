    function renderPosts(filter) {
      const container = document.getElementById('posts-list');
      container.innerHTML = '';

      const filtered = postsData.filter(p => {
        if (filter === 'all') return true;
        if (filter === 'direct') return p.type === 'direct';
        if (filter === 'bio') return p.type === 'bio';
        return p.sem === filter;
      });

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'post-card';

        let ctaBadgeClass = p.type === 'direct' ? 'cta-direct' : (p.type === 'bio' ? 'cta-bio' : 'cta-none');

        const slidesHtml = p.slides.map(s => `
          <div class="slide-item">
            <strong>${s.num}</strong>
            <span>${s.text.replace(/\n/g, '<br>')}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div>
            <div class="post-header">
              <span class="post-num">Post #${String(p.id).padStart(2, '0')} • ${p.dia}</span>
              <span class="post-cta-type ${ctaBadgeClass}">${p.ctaLabel}</span>
            </div>
            <h3 class="post-title">${p.titulo}</h3>
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; font-weight: 700;">
              🖼️ ESTRUTURA VISUAL DO POST (${p.formato}):
            </div>
            <div class="slides-container">
              ${slidesHtml}
            </div>
          </div>

          <div class="copy-box">
            <div>
              <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; font-weight: 700;">
                📝 LEGENDA COMPLETA (COPY PRONTA PARA PUBLICAR):
              </div>
              <div class="copy-text" id="copy-text-${p.id}">${p.copy}</div>
            </div>
            <button class="copy-btn" onclick="copyCaption(${p.id})">
              📋 Copiar Legenda do Post #${p.id}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function copyCaption(id) {
      const text = document.getElementById('copy-text-' + id)?.innerText;
      if (text) {
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.currentTarget;
          const orig = btn.innerHTML;
          btn.innerHTML = '✅ Legenda Copiada com Sucesso!';
          btn.style.background = '#38bdf8';
          btn.style.color = '#000';
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.background = '#10b981';
            btn.style.color = '#fff';
          }, 2000);
        });
      }
    }

    function filterPosts(filter) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderPosts(filter);
    }

    // Inicialização
    renderPosts('all');
  </script>
